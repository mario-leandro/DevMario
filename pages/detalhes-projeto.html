<!doctype html>

<html class="light" lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Minimalist Dev Portfolio</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1337ec",
              "background-light": "#f6f6f8",
              "background-dark": "#101322",
            },
            fontFamily: {
              display: ["Inter"],
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-white dark:bg-background-dark text-[#111218] dark:text-gray-100 antialiased transition-colors duration-300"
  >
    <!-- Container for centered content -->
    <div class="relative flex min-h-screen flex-col">
      <!-- Navigation -->
      <header
        class="sticky top-0 z-50 w-full border-b border-gray-100 bg-white/80 backdrop-blur-md dark:border-gray-800 dark:bg-background-dark/80 px-6 lg:px-40 py-4"
      >
        <div class="mx-auto flex max-w-[960px] items-center justify-between">
          <div class="flex items-center gap-2 group cursor-pointer">
            <div
              class="size-6 bg-primary rounded flex items-center justify-center text-white"
            >
              <span class="material-symbols-outlined text-sm">code</span>
            </div>
            <a
              class="text-lg font-bold tracking-tight text-[#111218] dark:text-white"
              href="/index.html"
              >Mario Marques</a
            >
          </div>
          <nav class="hidden md:flex items-center gap-8">
            <a
              class="text-sm font-medium text-gray-600 hover:text-primary dark:text-gray-400 dark:hover:text-primary transition-colors"
              href="/index.html#about"
              >Sobre</a
            >
            <a
              class="text-sm font-medium text-gray-600 hover:text-primary dark:text-gray-400 dark:hover:text-primary transition-colors"
              href="/index.html#skills"
              >Habilidades</a
            >
            <a
              class="text-sm font-medium text-gray-600 hover:text-primary dark:text-gray-400 dark:hover:text-primary transition-colors"
              href="/index.html#projects"
              >Projetos</a
            >
            <a
              class="text-sm font-medium text-gray-600 hover:text-primary dark:text-gray-400 dark:hover:text-primary transition-colors"
              href="/index.html#contact"
              >Contato</a
            >
          </nav>
          <button
            class="bg-primary hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-bold transition-all shadow-sm"
          >
            Currículo
          </button>
        </div>
      </header>
      <main
        class="flex-1 mx-auto max-w-[960px] w-full px-6 lg:px-10 py-16 md:py-24 space-y-24"
      >
        <!-- Project Details Section -->
        <section class="space-y-6">
          <h1
            class="text-4xl font-bold tracking-tight text-[#111218] dark:text-white"
          >
            Detalhes do Projeto
          </h1>
          <p class="text-lg text-gray-600 dark:text-gray-400">
            Aqui estão os detalhes do projeto selecionado. Este é um exemplo de
            como você pode estruturar a página de detalhes do projeto.
          </p>
        </section>
      </main>
      <!-- Footer -->
      <footer
        class="border-t border-gray-100 dark:border-gray-800 px-6 lg:px-40 py-12 bg-white dark:bg-background-dark"
      >
        <div
          class="mx-auto max-w-[960px] flex flex-col md:flex-row justify-between items-center gap-6"
        >
          <div class="flex flex-col items-center md:items-start gap-1">
            <p class="text-sm font-medium text-[#111218] dark:text-white">
              © 2026 Mario Marques
            </p>
            <p class="text-xs text-gray-400">
              Construído com precisão e código mínimo.
            </p>
          </div>
          <div
            class="flex items-center gap-6 text-sm font-medium text-gray-500 dark:text-gray-400"
          >
            <a
              class="hover:text-primary transition-colors"
              href="https://github.com/mario-leandro"
              target="_blank"
              >GitHub</a
            >
            <a
              class="hover:text-primary transition-colors"
              href="https://www.linkedin.com/in/dev-marioleandro/"
              target="_blank"
              >LinkedIn</a
            >
          </div>
        </div>
      </footer>
    </div>
  </body>

  <script src="components.js"></script>
</html>
